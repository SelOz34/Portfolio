<div
  class="menu-overlay"
  [class.is-opening]="menuPhase() === 'opening'"
  [class.is-closing]="menuPhase() === 'closing'"
>
  <nav id="main-navigation" class="site-navigation" aria-label="Main navigation">
    <div class="site-navigation__cream">
      <div class="site-navigation__links">
        <a
          #firstMenuLink
          href="#about"
          [class.is-activating]="activeTarget() === 'about'"
          (click)="$event.preventDefault(); navigateTo('about')"
        >
          <span class="navigation-frame" aria-hidden="true">
            <span class="navigation-frame__bottom"></span>
            <span class="navigation-frame__right"></span>
            <span class="navigation-frame__top"></span>
            <span class="navigation-frame__left"></span>
          </span>

          {{ 'navigation.about' | translate }}
        </a>

        <a
          href="#skills"
          [class.is-activating]="activeTarget() === 'skills'"
          (click)="$event.preventDefault(); navigateTo('skills')"
        >
          <span class="navigation-frame" aria-hidden="true">
            <span class="navigation-frame__bottom"></span>
            <span class="navigation-frame__right"></span>
            <span class="navigation-frame__top"></span>
            <span class="navigation-frame__left"></span>
          </span>

          {{ 'navigation.skills' | translate }}
        </a>

        <a
          href="#portfolio"
          [class.is-activating]="activeTarget() === 'portfolio'"
          (click)="$event.preventDefault(); navigateTo('portfolio')"
        >
          <span class="navigation-frame" aria-hidden="true">
            <span class="navigation-frame__bottom"></span>
            <span class="navigation-frame__right"></span>
            <span class="navigation-frame__top"></span>
            <span class="navigation-frame__left"></span>
          </span>

          {{ 'navigation.portfolio' | translate }}
        </a>
      </div>
    </div>

    <div class="site-navigation__contact">
      <div class="site-navigation__contact-inner">
        <div class="site-navigation__contact-text">
          <h2>{{ 'contact.title' | translate }}</h2>

          <a href="mailto:sefan@gmail.com"> sefan@gmail.com </a>
        </div>

        <div class="site-navigation__socials">
          <a
            href="https://github.com/SelOz34"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
          >
            <img src="/icons/github.svg" alt="" />
          </a>

          <a href="mailto:sefan@gmail.com" aria-label="Email">
            <img src="/icons/email.svg" alt="" />
          </a>

          <a
            href="https://www.linkedin.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
          >
            <img src="/icons/linkedin.svg" alt="" />
          </a>
        </div>
      </div>
    </div>
  </nav>
</div>
