  xmlns="http://www.w3.org/2000/svg"
  width="58"
  height="53"
  viewBox="0 0 58 53"
  fill="none"
  aria-hidden="true"
  focusable="false"
>
  @for (line of lines(); track $index) {

      [attr.x1]="line[0]"

      stroke="currentColor"
      stroke-width="4"
    />
  }
</svg>
