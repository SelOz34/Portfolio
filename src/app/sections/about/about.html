<section class="about" id="about" aria-labelledby="about-title">
  <div class="about__container">
    <h2 class="about__title" id="about-title">
      {{ 'about.title' | translate }}
    </h2>

    <div class="about__layout">
      <div class="about__content">
        <div class="about__description">
          <p>{{ 'about.description' | translate }}</p>
        </div>

        <div class="about__details">
          <div class="about__detail">
            <svg
              viewBox="0 0 32 32"
              width="32"
              height="32"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M3 15 16 4l13 11" />
              <path d="M7 13v15h18V13" />
              <path d="M13 28V18h6v10" />
              <path d="M3 7h7v7" />
            </svg>

            <span>{{ 'about.location' | translate }}</span>
          </div>

          <div class="about__detail">
            <svg
              viewBox="0 0 32 32"
              width="32"
              height="32"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <rect x="3" y="4" width="26" height="20" />
              <path d="M1 28h30M12 24l-2 4m10-4 2 4" />
            </svg>

            <span>{{ 'about.availability' | translate }}</span>
          </div>
        </div>

        <a class="about__button" href="mailto:s.oezbek@soz-studio.de">
          {{ 'about.button' | translate }}
        </a>
      </div>

      <div class="about__visual">
        <img
          class="about__portrait"
          [src]="portraitPath"
          [alt]="'about.portraitAlt' | translate"
          loading="lazy"
        />
      </div>
    </div>
  </div>
</section>
