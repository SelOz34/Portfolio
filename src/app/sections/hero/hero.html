<section class="hero" id="hero" aria-labelledby="hero-title">
  <div class="hero__content">
    <h1 class="hero__title" id="hero-title">
      <span>{{ 'hero.titleFirst' | translate }}</span>
      <span>{{ 'hero.titleSecond' | translate }}</span>
    </h1>

    <div class="hero__signature">
      <span class="hero__signature-line" aria-hidden="true"></span>
      <span class="hero__name">Stefan Engel</span>
    </div>
  </div>

  <a
    class="hero__email"
    href="mailto:s.oezbek@soz-studio.de"
    [attr.aria-label]="'hero.emailLabel' | translate"
  >
    s.oezbek@soz-studio.de
  </a>

  <a class="hero__scroll" href="#about" [attr.aria-label]="'hero.scrollLabel' | translate">
    <img src="/icons/scroll-down-arrow.svg" alt="" width="48" height="84" />

    <span>
      {{ 'hero.scrollFirst' | translate }}
      <br />
      {{ 'hero.scrollSecond' | translate }}
    </span>
  </a>
</section>
