<header #siteHeader class="site-header">
  <div class="site-header__inner">
    <a
      class="site-logo"
      href="#hero"
      aria-label="Back to top"
      (click)="$event.preventDefault(); navigateTo('hero')"
    >
      <img src="/icons/logo.svg" alt="SE Logo" width="67" height="30" />
    </a>

    <div class="site-header__actions">
      <div class="language-switch" aria-label="Language selection">
        <button
          type="button"
          [class.is-active]="language() === 'en'"
          [attr.aria-pressed]="language() === 'en'"
          (click)="setLanguage('en')"
        >
          EN
        </button>

        <button
          type="button"
          [class.is-active]="language() === 'de'"
          [attr.aria-pressed]="language() === 'de'"
          (click)="setLanguage('de')"
        >
          DE
        </button>
      </div>

      <button
        #menuToggle
        class="menu-button"
        type="button"
        aria-label="Toggle navigation"
        aria-controls="main-navigation"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <svg
          class="menu-button__icon"
          xmlns="http://www.w3.org/2000/svg"
          width="58"
          height="53"
          viewBox="0 0 58 53"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          @for (line of burgerLines(); track $index) {
            <line
              [attr.x1]="line[0]"
              [attr.y1]="line[1]"
              [attr.x2]="line[2]"
              [attr.y2]="line[3]"
              stroke="currentColor"
              stroke-width="4"
            />
          }
        </svg>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    @if (menuOpen()) {
      <div
        class="menu-overlay"
        [class.is-opening]="menuPhase() === 'opening'"
        [class.is-closing]="menuPhase() === 'closing'"
      >
        <nav id="main-navigation" class="site-navigation" aria-label="Main navigation">
          <div class="site-navigation__cream">
            <div class="site-navigation__links">
              <a
                #firstMenuLink
                href="#about"
                (click)="$event.preventDefault(); navigateTo('about')"
              >
                <span class="navigation-corner" aria-hidden="true"></span>
                {{ language() === 'de' ? 'Über mich' : 'About me' }}
              </a>

              <a href="#skills" (click)="$event.preventDefault(); navigateTo('skills')">
                <span class="navigation-corner" aria-hidden="true"></span>
                {{ language() === 'de' ? 'Meine Fähigkeiten' : 'My skills' }}
              </a>

              <a href="#portfolio" (click)="$event.preventDefault(); navigateTo('portfolio')">
                <span class="navigation-corner" aria-hidden="true"></span>
                Portfolio
              </a>
            </div>
          </div>

          <div class="site-navigation__contact">
            <div class="site-navigation__contact-inner">
              <div class="site-navigation__contact-text">
                <h2>Say hi!</h2>
                <a href="mailto:sefan@gmail.com"> sefan@gmail.com </a>
              </div>

              <div class="site-navigation__socials">
                <a
                  href="https://github.com/"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="GitHub"
                >
                  <img src="/icons/github.svg" alt="" />
                </a>

                <a href="mailto:sefan@gmail.com" aria-label="Email">
                  <img src="/icons/email.svg" alt="" />
                </a>

                <a
                  href="https://www.linkedin.com/"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="LinkedIn"
                >
                  <img src="/icons/linkedin.svg" alt="" />
                </a>
              </div>
            </div>
          </div>
        </nav>
      </div>
    }
  }
</header>

<main>
  <section class="hero" id="hero" aria-labelledby="hero-title">
    <h1 class="hero__title" id="hero-title">
      <span>Frontend</span>
      <span>Developer</span>
    </h1>
  </section>
</main>

<router-outlet />
